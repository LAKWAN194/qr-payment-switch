spring:
  application:
    name: switch-service
  datasource:
    url: ${SWITCH_DB_URL:jdbc:postgresql://localhost:5481/switch}
    username: ${SWITCH_DB_USER:switch}
    password: ${SWITCH_DB_PASSWORD:switch}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: ${SWITCH_PORT:8180}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
