server {
  listen 80;
  root /usr/share/nginx/html;

  # Same contract as the Vite dev server: /api/* goes to the switch with the prefix removed.
  location /api/ {
    proxy_pass http://switch-service:8180/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }
}
