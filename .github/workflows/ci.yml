name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    name: Java build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Integration tests start PostgreSQL with Testcontainers; GitHub's runners have Docker.
      - name: Build, unit and integration tests
        run: ./mvnw -B verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-reports
          path: |
            */target/surefire-reports/
            */target/failsafe-reports/
            */target/site/jacoco*/

  fraud-scorer:
    name: Fraud scorer lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fraud-scorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fraud-scorer/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  dashboard:
    name: Dashboard lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: merchant-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: merchant-dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile apps config --quiet
      - run: docker compose --profile apps build
