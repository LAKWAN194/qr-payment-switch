[project]
name = "fraud-scorer"
version = "0.1.0"
description = "Real-time fraud scoring for the QR payment switch"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
